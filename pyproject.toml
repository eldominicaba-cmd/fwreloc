[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwreloc"
version = "0.1.0"
description = "Firmware patch reversion / compatibility tooling"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["r2pipe>=0.16.0"]
scripts = {fwreloc = "fwreloc.cli:main"}

[project.optional-dependencies]
dev = ["r2pipe>=0.16.0"]

[tool.setuptools]
packages = ["fwreloc"]
