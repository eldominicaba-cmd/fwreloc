[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwreloc-monorepo"
version = "0.1.0"
description = "Firmware reverse-engineering toolbox — multiple small, well-tested CLI tools."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
packages = [
    "shared",
    "tools",
    "tools.entropy",
    "tools.fwreloc",
    "tools.salvage",
    "tools.savemap",
    "tools.cutcard",
]

[project.scripts]
fwreloc = "tools.fwreloc.cli:main"
salvage = "tools.salvage.main:main"
savemap = "tools.savemap.main:main"
cutcard = "tools.cutcard.main:main"
entropy = "tools.entropy.main:main"
