name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system radare2
        run: sudo apt-get update && sudo apt-get install -y radare2

      - name: Install Python deps and project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tool test suites
        run: python -m unittest discover -s tools -t . -p "test_*.py" -v
